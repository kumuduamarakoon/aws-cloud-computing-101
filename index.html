<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sri Lanka Famous Places</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Explore Sri Lanka 🌴</h1>
        <p>Discover the beauty of the Pearl of the Indian Ocean</p>
    </header>

    <section class="places" id="placesContainer">
        <!-- Cards will appear here -->
    </section>

    <section class="form-section">
        <h2>Add New Place</h2>
        <form id="placeForm">
            <input type="text" id="name" placeholder="Place Name" required>
            <input type="text" id="image" placeholder="Image URL" required>
            <textarea id="description" placeholder="Short Description" required></textarea>
            <button type="submit">Add Place</button>
        </form>
    </section>

<script src="script.js"></script>
</body>
</html>
